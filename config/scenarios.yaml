                compatible_hands: either
                clearance_m: 0.08
            articulation:
              joint_id: cabinet-door-hinge
              parent_object_id: cabinet-frame
              type: hinge
              semantic: cabinet_door
              axis: { x: 0, y: 1, z: 0 }
              anchor_world: { x: 6.25, y: 1, z: 5.595 }
