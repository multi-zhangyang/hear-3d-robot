scenarios:
  humanoid_frontier:
    kind: procedural
    runtime: humanoid_g1
    title: 人形方块边境
    generate:
      bounds: { width: 36, depth: 36 }
      cell: 3
      obstacle_density: 0.16
      minimum_obstacle_height: 0.55
      maximum_obstacle_height: 2.7
      visibility_radius: 8
      objects:
        - id: amber_crate
          kind: crate
          color: "#c7833b"
          size: { x: 0.5, y: 0.5, z: 0.5 }
          portable: true
        - id: blue_crate
          kind: crate
          color: "#4778c8"
          size: { x: 0.55, y: 0.55, z: 0.55 }
          portable: true
      zones:
        - id: frontier_beacon
          color: "#55b38b"
          size: { x: 2.2, y: 0.02, z: 2.2 }
      default_goal:
        summary: 自主穿越随机方块世界并进入信标区域。
        predicates:
          - type: robot_in_zone
            zone_id: frontier_beacon
            tolerance: 0.2

  humanoid_realm:
    kind: procedural
    runtime: humanoid_g1
    title: 人形方块疆域
    generate:
      bounds: { width: 54, depth: 54 }
      cell: 3
      obstacle_density: 0.19
      minimum_obstacle_height: 0.45
      maximum_obstacle_height: 3.2
      visibility_radius: 9
      objects:
        - id: copper_crate
          kind: crate
          color: "#b96f45"
          size: { x: 0.55, y: 0.55, z: 0.55 }
          portable: true
        - id: moss_crate
          kind: crate
          color: "#6f9651"
          size: { x: 0.6, y: 0.6, z: 0.6 }
          portable: true
        - id: violet_crate
          kind: crate
          color: "#7d63b8"
          size: { x: 0.45, y: 0.45, z: 0.45 }
          portable: true
      zones:
        - id: distant_beacon
          color: "#58b99c"
          size: { x: 2.3, y: 0.02, z: 2.3 }
        - id: rest_clearing
          color: "#e2b95f"
          size: { x: 2.1, y: 0.02, z: 2.1 }
      default_goal:
        summary: 自主探索大型方块疆域并抵达远方信标。
        predicates:
          - type: robot_in_zone
            zone_id: distant_beacon
            tolerance: 0.2

  humanoid_courtyard:
    kind: authored
    runtime: humanoid_g1
    title: 人形庭院
    scenario:
      title: 人形庭院
      bounds: { width: 18, depth: 16 }
      visibility_radius: 7
      robot: { x: 2.5, z: 2.5, yaw: 0 }
      obstacles:
        - id: stone_column
          center: { x: 8, y: 1.1, z: 7.5 }
          size: { x: 1.4, y: 2.2, z: 1.4 }
        - id: low_block
          center: { x: 12.5, y: 0.35, z: 4.5 }
          size: { x: 2.2, y: 0.7, z: 1.5 }
      objects:
        - id: courtyard_crate
          kind: crate
          color: "#bd7844"
          position: { x: 4.5, y: 0.25, z: 5.5 }
          size: { x: 0.5, y: 0.5, z: 0.5 }
          portable: true
      zones:
        - id: courtyard_beacon
          color: "#50aa85"
          center: { x: 15, y: 0.01, z: 13 }
          size: { x: 2, y: 0.02, z: 2 }
      default_goal:
        summary: 自主通过庭院并进入信标区域。
        predicates:
          - type: robot_in_zone
            zone_id: courtyard_beacon
            tolerance: 0.2

  humanoid_workyard:
    kind: authored
    runtime: humanoid_g1
    title: 人形装配场
    scenario:
      title: 人形装配场
      bounds: { width: 28, depth: 22 }
      visibility_radius: 8
      robot: { x: 4, z: 4, yaw: 0 }
      obstacles:
        - id: north_storage
          center: { x: 13, y: 1.2, z: 4 }
          size: { x: 5, y: 2.4, z: 1.2 }
        - id: central_pillar
          center: { x: 13, y: 1.5, z: 11 }
          size: { x: 1.4, y: 3, z: 1.4 }
        - id: south_storage
          center: { x: 20, y: 0.8, z: 17 }
          size: { x: 4.5, y: 1.6, z: 1.4 }
      objects:
        - id: pickup_stand
          kind: stand
          color: "#76877c"
          position: { x: 4.2, y: 0.555, z: 4.8 }
          size: { x: 0.12, y: 0.01, z: 0.12 }
          portable: false
        - id: assembly_rod
          kind: workpiece
          color: "#d18a45"
          position: { x: 4.2, y: 0.67, z: 4.8 }
          size: { x: 0.06, y: 0.22, z: 0.06 }
          portable: true
          capability:
            shape: cylinder
            mass_kg: 0.35
            friction: { sliding: 0.8, torsional: 0.012, rolling: 0.002 }
            affordances: []
            interaction_points: []
      zones:
        - id: assembly_bay
          color: "#52b995"
          center: { x: 4.2, y: -0.025, z: 6.4 }
          size: { x: 1.4, y: 0.05, z: 1.4 }
      default_goal:
        summary: 将装配杆稳放到装配区域。
        predicates:
          - type: object_placed
            object_id: assembly_rod
            zone_id: assembly_bay
            tolerance: 0.05

  humanoid_cabinet:
    kind: authored
    runtime: humanoid_g1
    title: 人形柜体空间
    scenario:
      title: 人形柜体空间
      bounds: { width: 20, depth: 18 }
      visibility_radius: 9
      robot: { x: 7, z: 2.8, yaw: 0 }
      obstacles: []
      objects:
        - id: side-workbench
          kind: workbench
          color: "#59625d"
          position: { x: 13.5, y: 0.55, z: 10.5 }
          size: { x: 3.2, y: 1.1, z: 1.2 }
          portable: false
          capability:
            shape: box
            mass_kg: 32
            affordances: [support_surface]
            interaction_points: []
            support_surface:
              local_center: { x: 0, y: 0.55, z: 0 }
              size: { x: 3.2, y: 0, z: 1.2 }
              normal: { x: 0, y: 1, z: 0 }
        - id: cabinet-frame
          kind: cabinet
          color: "#59645d"
          position: { x: 7, y: 1, z: 6 }
          size: { x: 1.5, y: 1.7, z: 0.72 }
          portable: false
          capability:
            shape: box
            mass_kg: 18
            affordances: [container]
            interaction_points: []
            container:
              interior_center: { x: 0, y: 0, z: 0 }
              interior_size: { x: 1.4, y: 1.6, z: 0.65 }
              opening_direction: { x: 0, y: 0, z: -1 }
