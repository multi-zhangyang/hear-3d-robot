scenarios:
  humanoid_frontier:
    kind: procedural
    runtime: humanoid_g1
    title: 人形方块边境
    generate:
      bounds: { width: 36, depth: 36 }
      cell: 3
      obstacle_density: 0.16
      minimum_obstacle_height: 0.55
      maximum_obstacle_height: 2.7
      visibility_radius: 8
      objects:
        - id: amber_crate
          kind: crate
          color: "#c7833b"
          size: { x: 0.5, y: 0.5, z: 0.5 }
          portable: true
        - id: blue_crate
          kind: crate
          color: "#4778c8"
          size: { x: 0.55, y: 0.55, z: 0.55 }
          portable: true
      zones:
        - id: frontier_beacon
          color: "#55b38b"
          size: { x: 2.2, y: 0.02, z: 2.2 }
      default_goal:
        summary: 自主穿越随机方块世界并进入信标区域。
        predicates:
          - type: robot_in_zone
            zone_id: frontier_beacon
            tolerance: 0.2

  humanoid_realm:
    kind: procedural
    runtime: humanoid_g1
    title: 人形方块疆域
    generate:
      bounds: { width: 54, depth: 54 }
      cell: 3
      obstacle_density: 0.19
      minimum_obstacle_height: 0.45
      maximum_obstacle_height: 3.2
      visibility_radius: 9
      objects:
        - id: copper_crate
          kind: crate
          color: "#b96f45"
          size: { x: 0.55, y: 0.55, z: 0.55 }
          portable: true
        - id: moss_crate
          kind: crate
          color: "#6f9651"
          size: { x: 0.6, y: 0.6, z: 0.6 }
          portable: true
        - id: violet_crate
          kind: crate
          color: "#7d63b8"
          size: { x: 0.45, y: 0.45, z: 0.45 }
          portable: true
      zones:
        - id: distant_beacon
          color: "#58b99c"
          size: { x: 2.3, y: 0.02, z: 2.3 }
        - id: rest_clearing
          color: "#e2b95f"
          size: { x: 2.1, y: 0.02, z: 2.1 }
      default_goal:
        summary: 自主探索大型方块疆域并抵达远方信标。
        predicates:
          - type: robot_in_zone
            zone_id: distant_beacon
            tolerance: 0.2

  humanoid_courtyard:
    kind: authored
    runtime: humanoid_g1
    title: 人形庭院
    scenario:
      title: 人形庭院
      bounds: { width: 18, depth: 16 }
      visibility_radius: 7
      robot: { x: 2.5, z: 2.5, yaw: 0 }
      obstacles:
        - id: stone_column
          center: { x: 8, y: 1.1, z: 7.5 }
          size: { x: 1.4, y: 2.2, z: 1.4 }
        - id: low_block
          center: { x: 12.5, y: 0.35, z: 4.5 }
          size: { x: 2.2, y: 0.7, z: 1.5 }
      objects:
        - id: courtyard_crate
          kind: crate
          color: "#bd7844"
          position: { x: 4.5, y: 0.25, z: 5.5 }
          size: { x: 0.5, y: 0.5, z: 0.5 }
          portable: true
      zones:
        - id: courtyard_beacon
          color: "#50aa85"
          center: { x: 15, y: 0.01, z: 13 }
          size: { x: 2, y: 0.02, z: 2 }
      default_goal:
        summary: 自主通过庭院并进入信标区域。
        predicates:
          - type: robot_in_zone
            zone_id: courtyard_beacon
            tolerance: 0.2
