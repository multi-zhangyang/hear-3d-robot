name: Live autonomy

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Real-model verification suite
        required: true
        default: autonomy
        type: choice
        options:
          - mission
          - autonomy
          - endurance
          - all
      scenario:
        description: Scenario identifier
        required: true
        default: humanoid_courtyard
        type: string
      seed:
        description: Optional unsigned world seed
        required: false
        type: string
      timeout_minutes:
        description: Per-run model and physics verification timeout
        required: true
        default: "30"
        type: string
      run_count:
        description: Repeated same-world runs used to verify autonomous diversity
        required: true
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: live-autonomy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Real model, physics and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: live-autonomy
    env:
      AI_PROVIDER: ${{ vars.HEAR_LIVE_AI_PROVIDER }}
      AI_BASE_URL: ${{ secrets.HEAR_LIVE_AI_BASE_URL }}
      AI_MODEL: ${{ vars.HEAR_LIVE_AI_MODEL }}
      AI_API_KEY: ${{ secrets.HEAR_LIVE_AI_API_KEY }}
      AI_CONTEXT_WINDOW_TOKENS: ${{ vars.HEAR_LIVE_AI_CONTEXT_WINDOW_TOKENS }}
      AI_MAX_OUTPUT_TOKENS: ${{ vars.HEAR_LIVE_AI_MAX_OUTPUT_TOKENS }}
      AI_COMPACT_TRIGGER_TOKENS: ${{ vars.HEAR_LIVE_AI_COMPACT_TRIGGER_TOKENS }}
      HEAR_LIVE_SCENARIO: ${{ inputs.scenario }}
      HEAR_LIVE_SEED: ${{ inputs.seed }}
      HEAR_LIVE_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
      HEAR_LIVE_RUN_COUNT: ${{ inputs.run_count }}
      HEAR_LIVE_SEED_STRATEGY: same
      HEAR_RUNS_DIR: ${{ runner.temp }}/hear-live-runs
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run selected real-model suite
        env:
          HEAR_LIVE_SUITE: ${{ inputs.suite }}
          HEAR_LIVE_REPORT_DIR: ${{ runner.temp }}/hear-live-reports
        run: |
          mkdir -p "$HEAR_LIVE_REPORT_DIR"
          case "$HEAR_LIVE_SUITE" in
            mission)
              HEAR_LIVE_REPORT="$HEAR_LIVE_REPORT_DIR/mission.json" pnpm run test:live:mission
              ;;
            autonomy)
              HEAR_LIVE_REPORT="$HEAR_LIVE_REPORT_DIR/autonomy.json" pnpm run test:live:autonomy
              ;;
            endurance)
              HEAR_LIVE_REPORT="$HEAR_LIVE_REPORT_DIR/endurance.json" pnpm run test:live:endurance
              ;;
            all)
              HEAR_LIVE_REPORT="$HEAR_LIVE_REPORT_DIR/mission.json" pnpm run test:live:mission
              HEAR_LIVE_REPORT="$HEAR_LIVE_REPORT_DIR/autonomy.json" pnpm run test:live:autonomy
              HEAR_LIVE_REPORT="$HEAR_LIVE_REPORT_DIR/endurance.json" pnpm run test:live:endurance
              ;;
          esac

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-autonomy-report
          path: ${{ runner.temp }}/hear-live-reports
          if-no-files-found: ignore
          retention-days: 14
